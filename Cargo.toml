# 루트 패키지가 `moai` 그대로고 `default-members` 는 두지 않는다 — 루트에서 `cargo build`·`cargo test`
# 는 `moai` 하나만 돈다(릴리스 빌드·시험이 크레이트 때문에 늘지 않는다). 크레이트까지 돌려야 하는 자리(CI 의
# clippy·시험·MSRV)는 `--workspace` 를 명시한다 (moai-v53u.dh8).
[workspace]
members = ["crates/moai-gantt"]

[package]
name = "moai"
version = "0.51.0"
edition = "2024"
description = "이슈 트래커. 승인 게이트 없음. 규율은 `moai status` 가 비춘다."
license = "MIT"
repository = "https://github.com/buzzni/moai"
# **let-chain 이 쓰인다**(`src/cmd/mv.rs`·`src/cmd/defer.rs` 외). edition 2024 만으로는
# 1.85 지만 let-chain 은 1.88 부터다 — 안 적으면 그 사이 판을 든 사람이 cargo 의
# "1.88 이상이 필요하다" 대신 `expected expression, found keyword 'let'` 을 본다.
# README 가 그 밖의 기계에 소스 빌드를 대고 있어, 그 사람이 처음 받는 말이 이것이다.
rust-version = "1.88"

[lib]
# 몸은 src/lib.rs 에 있고 src/main.rs 는 moai::run() 을 부르기만 한다. 바이너리 크레이트일 때는 문서 주석의
# 코드 울타리가 시험으로 돈 적이 없어, lib 이 되며 처음 돌지 않게 끈다(moai-72qj.nwl).
doctest = false

[lints]
workspace = true

[dependencies]
# Picture codecs are pure Rust; keep AVIF/EXR/TIFF/rayon out of the binary.
# 2026-11-02: before 13,641,968 B; after image support 14,302,528 B (+660,560 B,
# 91% of 15 MiB). This is the cost at introduction, not the current size.
# Clean release build: 348.648 s under load; release LTO remains enabled.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
ring = "0.17"
base64 = "0.23"
# `wrap_help` 는 켜지 않는다 — 도움말에 실제 개행을 넣어 좁은 창에서 예시 명령이 복사하면
# 깨진다. 까닭은 src/cli.rs 의 `Cli` 위 주석에 있다 (moai-opjn).
clap          = { version = "4", features = ["derive", "color", "unicode"] }
serde         = { version = "1", features = ["derive"] }
# Keep selected values raw; preserve_order would change every Value and generated skill manifest.
serde_json    = { version = "1", features = ["raw_value"] }
anstream      = "1"
anstyle       = "1"
unicode-width = "0.2"
# grapheme 으로 걷는다. ratatui 가 이미 끌고 오는 판이라 무게는 0 이다.
unicode-segmentation = "1"
fs2           = "0.4"
# 기본 기능을 끈다 — 달력 위젯은 `time` 을, 다른 백엔드는 termwiz 를 끌고 온다.
# crossterm 0.29 는 이미 로컬에 있던 판이라 그것을 그대로 쓴다.
ratatui       = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
# 사용자 설정(`user_config`)을 고쳐 쓸 때 모르는 키·주석·줄 모양을 보존한다.
# `serde` 기능은 끈다 — 표 배열 하나를 읽는 데 역직렬화가 필요 없다.
toml_edit     = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
# 새 판이 났는지 GitHub 에 묻는 길(moai-omww, 사용자 결정 2026-09-21). **새 축의 의존성이라
# 먼저 상의한 자리다** — CLAUDE.md 가 개수와 무관하게 상의하라고 적은 그 자리고, 재서 대고 물었다.
# 고를 때 잰 표(빈 크레이트 308,752바이트에 **기본 기능으로** 얹어 잰 값이다): `ureq` 3 은
# +1,880,088바이트, `minreq`(https-rustls)는 +1,137,240바이트, `curl` 프로세스는 0바이트였다.
# 그런데도 크레이트를 고른 것은 curl 도 wget 도 없는 기계에서 이 기능이 영영 "못 물었다" 로
# 서기 때문이다.
#
# **이 저장소에서 실제로 든 값은 +1,775,096바이트다**(2026-09-22 에 쟀다 — 들이기 전
# 6,186,192바이트, 부르는 자리가 선 뒤 7,961,288바이트, 15MB 예산의 53%). **여기 적는 것은 든
# 값이지 지금 크기가 아니다** — 절대 수는 커밋마다 움직여, 읽는 사람이 무엇과 견줄지 모른다.
# 지금 크기는 `ls -l target/release/moai` 가 댄다. 위의 표와 다른 것은 기능을 깎아서다: `gzip` 을
# 끄면 `flate2` 가 안 따라오고, 답이 JSON 몇 KB 라 푸는 값도 없다.
ureq          = { version = "3", default-features = false, features = ["rustls"] }
# 탐색기의 간트 배치(moai-i4hf)가 그리는 위젯 — 같은 워크스페이스의 크레이트라 전이 의존이 ratatui 하나다(moai-v53u).
moai-gantt    = { path = "crates/moai-gantt" }

# `access(X_OK)` 하나를 쓴다(`cmd::runnable`, moai-dhx9, 2026-09-23 사용자 결정) — 표준
# 라이브러리에 없다.
#
# **크레이트는 0개가 늘었다 — 어느 타깃에서나.** 그러자고 유닉스에만 건다: `fs2` 가 제 `libc` 를
# `[target."cfg(unix)".dependencies]` 로 걸어 유닉스에서는 이미 빌드 그래프에 서 있고, 윈도에서는
# `winapi` 가 그 자리에 선다. 맨 `[dependencies]` 에 두면 유닉스에서만 0개가 늘고 윈도에서는
# 하나가 느는데, 거기서는 쓰이지도 않는다 — 부르는 자리(`cmd::runnable`)가 `#[cfg(unix)]` 안이라
# 윈도 갈래는 `path.is_file()` 하나다.
#
# 이 저장소에서 든 비용은 **+5,960바이트**다(2026-09-23 에 쟀다 — 들이기 전 8,154,112바이트,
# 들인 뒤 8,160,072바이트, 15MB 예산의 54% 로 자리가 안 바뀐다). 클린 릴리스 빌드는
# 그대로였다(그날 228초) — `libc` 는 어차피 컴파일되던 것이다.
[target.'cfg(unix)'.dependencies]
libc          = "0.2"
# Crossterm already uses this version and registry. Add only the self-pipe API for the TUI's idle wait;
# keep event parsing on the owner thread, including while handing the terminal to an editor.
signal-hook = { version = "0.3", default-features = false }

# named pipe 의 전송과 콘솔 이벤트(`transport::pipe`, `daemon::server`, moai-0yo3). 이 판은 이미 빌드 그래프에 서 있다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# 두 패키지(`moai`·`moai-gantt`)가 `[lints] workspace = true` 로 같이 쓴다.
# CI 의 ci-gate 가 clippy 를 `-D warnings` 로 돌린다. 그러니 여기 적힌 네 줄은
# "이건 경고가 아니다" 라는 선언이고, 줄마다 `#[allow]` 을 흩뿌리는 대신 까닭과
# 함께 한자리에 둔다. 새 줄을 더할 때도 까닭을 같이 적는다 — 까닭 없는 allow 는
# 다음 사람이 걷어도 되는지 못 가린다.
[workspace.lints.clippy]
# 명령의 문맥과 빌린 자료를 그대로 건넨다. `cmd/add.rs` 의 bulk·create_drafts,
# `cmd/show.rs` 의 one, `cmd/tui.rs` 의 listing, `cmd/wiki.rs` 의 said 는 호출마다
# 설정·사람·자리가 달라, 인자 수만 줄이는 구조체는 서로 다른 문맥을 한 상태로 묶는다.
# 같은 예외는 `hook.rs` 의 closing, `tui/stats.rs` 의 count, `view.rs` 의 list·ready,
# `report.rs` 의 status_in_scope, `report/gantt.rs` 의 actual_of, `ctl/serve.rs` 의 handle,
# `web/mod.rs` 의 stream_events 에도 선다. 경고의 개수는 코드가 자라면 바뀐다 — 목록의
# 개수를 계약으로 적지 않고, 예외를 둘 까닭을 남긴다(moai-fcj3.czd).
too_many_arguments = "allow"
# 반환 튜플과 콜백의 모양이 그 자리의 계약이다. 타입 별칭으로 감추면 무엇을 빌리거나
# 돌려주는지 호출부에서 안 보인다. 반환 튜플은 `cmd/hook.rs`·`report.rs`·`tz.rs`·
# `worktree.rs` 와 `web/api.rs` 의 split_project, `web/mod.rs` 의 event_target·ctl_write_query 에,
# 콜백·공유 값은 `cmd/hook.rs` 의 PICKS_READ, `hook.rs` 의 find, `store.rs` 의 torn,
# `tui/draw.rs` 의 draw, `tui/layer.rs` 의 reading 에 선다. 시험의 자료 표도 같은 예외다
# (`hook.rs`·`model.rs`·`query.rs`·`tui/keys.rs`·`tests/cli.rs`).
type_complexity = "allow"
# `projects::State` 와 `store` 의 Stop·Trouble·ConfigWriteStop 은 실패한 까닭을 통째로
# 들고 온다. 박싱하면 그 값을 읽는 자리가 모두 한 겹 깊어지는데, 사람이 한 번 부르는
# 명령의 오류 경로에서 그 간접 참조를 더할 값어치가 없다.
result_large_err = "allow"
# `projects::State::Open` 은 Repo 와 Load 를, `store::Opened::Repo` 는 Repo 를 통째로 든다.
# 빈 갈래와 크기가 다른 것은 그 자료의 뜻이다. 둘 다 프로젝트를 열 때 한 번 짓고 읽는
# 값이라, 크기를 맞추려고 박싱하면 읽는 자리만 한 겹 깊어진다.
large_enum_variant = "allow"

[profile.release]
lto = true
strip = true
