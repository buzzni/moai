# 이 저장소가 이미 서 있는 꼴에 맞춘다(moai-hwxc). 두 줄을 적었고, 둘 다 재서 나왔다.
#
# ## `use_small_heuristics = "Max"`
#
# **이 줄이 실제로 꼴을 정한다.** rustfmt 는 줄이 상한 아래여도 제 꼴로 다시
# 눕히는데, 그 꼴을 정하는 것은 `max_width` 가 아니라 거기서 나온 파생 폭들이다
# (`fn_call_width` 는 기본이 60%, 곧 120 의 72칸). 그래서 기본값으로 한 판을 돌리면
# 72칸을 넘는 부름이 죄다 세로로 쪼개진다 — 재 보니 `src`·`tests` 가
# 89,409줄에서 105,614줄로, **16,205줄(+18%)** 불었다. 이 저장소의 코드는 한 줄에
# 눕히는 꼴이라, 그것은 있던 꼴을 지키는 것이 아니라 새 꼴을 들이는 일이다.
#
# `"Max"` 는 그 파생 폭들을 `max_width` 와 같게 둔다. 같은 판이 90,680줄로 끝난다 —
# **1,271줄(+1.4%)**. 움직이는 것이 정말로 120칸을 넘는 줄뿐이다.
#
# ## `max_width = 120`
#
# - 코드 줄의 99%가 118자 안에 있다(p95 97 · p99 118 · p99.5 126). 기본 100 은 이
#   저장소가 안 쓰는 폭이다
# - 주석은 rustfmt 가 안 건드린다(`wrap_comments` 의 기본값은 false). 손으로 접어 둔
#   긴 한국어 문서 블록은 어느 값에서도 그대로고, 이 값이 다스리는 것은 코드 줄뿐이다
# - **한글이 든 코드 줄은 글자 수보다 넓게 그려진다.** rustfmt 는 글자로 재고 터미널은
#   칸으로 그리는데, 한글 글자열을 든 코드 줄이 341개 있다. 120자에 선 줄이 화면에서는
#   139칸까지 간다 — 130 으로 올리면 그 최악이 150칸을 넘는다
#
# `"Max"` 를 켠 채로는 130 이 오히려 줄 수를 줄이고(-727) 140 은 더 줄인다. 줄 수가
# 아니라 화면 폭이 여기서 고르는 자다.
max_width = 120
use_small_heuristics = "Max"
