# `v*` 태그를 밀면 바이너리와 checksums 를 GitHub 릴리스에 올린다.
#
# cargo-dist 를 안 쓰고 손으로 적은 까닭은 고칠 수 있게 하기 위해서다 (사람이
# 정했다, 2026-09-20). 생성한 워크플로는 손으로 고치면 안 되는데, 여기에는 이
# 저장소만의 규칙이 둘 있다 — 바이너리 15MB 예산과 설치 스크립트가 checksums
# 없이는 안 깔게 하는 것(moai-j54h). 그 둘을 생성물 위에 얹으면 다음 생성이
# 지운다.
#
# 배포 채널은 GitHub Releases 와 install.sh 까지다 (사람이 정했다, 2026-09-20).
# crates.io 와 Homebrew tap 은 이번 범위가 아니다.
name: release

on:
  push:
    tags: ["v*"]
  # 태그 없이 한 번 돌려 볼 자리. 올리는 잡은 태그일 때만 선다.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 태그를 믿고 굴러가는 것이 이 워크플로 전체라, 믿어도 되는지를 맨 앞에서 잰다.
  guard:
    name: 태그와 Cargo.toml
    runs-on: ubuntu-latest
    # 빌드 행렬이 이 뒤에 선다 — 여기가 매달리면 행렬이 기본 6시간을 기다린다.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 태그 이름은 `${{ }}` 로 스크립트에 붙이지 않는다 — 이름에 든 글자가 셸
      # 명령이 되는 자리다. 환경으로 준다.
      - name: 판이 어긋나면 여기서 멈춘다
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            scripts/check-version.sh "$REF_NAME"
          else
            # **대입으로 받는다.** `printf "$(…)"` 안의 명령 치환이 지면 `set -e` 가
            # 그것을 못 봐, 판을 못 읽은 판이 빈칸을 찍고 초록으로 지나간다 — 일찍
            # 멈추라고 둔 잡이 안 멈추는 자리다.
            version=$(scripts/check-version.sh --print)
            printf '태그가 아닌 판이다 — Cargo.toml 의 %s 로 굴러간다\n' "$version"
          fi

  build:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # 한 칸이 죽어도 남은 칸은 끝까지 간다 — 무엇이 되고 무엇이 안 되는지를
      # 한 판에서 본다.
      fail-fast: false
      matrix:
        include:
          # musl 정적 판이다. 어느 배포판에서도 돌고 컨테이너에서도 돈다.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 툴체인을 캐시에서 푼다 — 까닭과 잰 값은 `ci.yml` 의 `ci-gate` 에 있다.
      #
      # **밑의 `rustup target add` 보다 앞에 선다.** 그것이 이 잡에서 rustup 을
      # 처음 부르는 자리라, 뒤에 두면 캐시를 풀기도 전에 박아 둔 판을 통째로
      # 받는다 — 캐시가 아무것도 안 벌어 주던 자리다.
      - name: 박아 둔 판을 읽는다
        id: toolchain
        run: |
          set -euo pipefail
          # 따옴표는 둘 다 받고 빈칸도 탭도 지난다. TOML 이 허락하는 꼴을 여기서
          # 더 좁힐 까닭이 없다.
          channel=$(sed -n "s/^[[:space:]]*channel[[:space:]]*=[[:space:]]*[\"']\(.*\)[\"'].*/\1/p" rust-toolchain.toml || true)
          # **못 읽으면 막지 않는다.** 여기서 지면 판 이름을 못 읽었다는 까닭으로
          # 멀쩡한 PR 이 붉어진다 — 이 스텝이 하는 일은 캐시를 맞히는 것뿐이고,
          # 못 맞히면 rustup 이 그대로 받으면 된다. 못 잰 판은 도는 쪽으로 선다.
          if [ -z "$channel" ]; then
            echo "::warning::rust-toolchain.toml 에서 channel 을 못 읽었다 — 툴체인을 캐시에서 안 푼다"
          fi
          printf 'channel=%s\n' "$channel" >>"$GITHUB_OUTPUT"

      # **열쇠에 타깃이 든다.** 밑에서 더한 타깃의 std 가 툴체인 자리 안으로
      # 들어가, 칸마다 담기는 것이 다르다. `ci.yml` 과 열쇠를 나눠 쓰면 musl 을
      # 더한 칸이 담은 것을 거기가 덮어쓰거나 그 반대가 된다.
      #
      # **태그 판은 이 열쇠를 대개 못 맞힌다.** GitHub 은 캐시를 판을 낸 ref 와
      # 기본 가지에서만 읽는데, 이 워크플로는 태그와 손으로 돌린 판에서만 돈다 —
      # `refs/tags/v0.1.0` 이 담은 것을 `refs/tags/v0.2.0` 이 못 읽는다. 누가
      # `develop` 에서 한 번 돌려 두면 그때 담긴 것을 태그 판이 읽는다(기본 가지가
      # `develop` 이다). 밑의 `cargo-rel-*` 도 처음부터 같은 자리라 고칠 것이 이
      # 스텝 하나가 아니고, 그 판단은 idea `moai-uave` 에 담았다. **순서를 바로잡은
      # 값은 그와 별개로 선다** — 맞히는 판에서 캐시가 rustup 앞에 서 있어야 값이
      # 있고, 그 자리가 비어 있던 것이 리뷰 moai-ch4z.639 가 짚은 것이다.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.toolchain.outputs.channel != ''
        with:
          path: ~/.rustup/toolchains/${{ steps.toolchain.outputs.channel }}-*
          key: rustup-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}

      # 캐시가 맞은 판에서는 이미 자리에 있어 매니페스트만 보고 끝난다. 못 맞힌
      # 판은 여기서 툴체인과 타깃을 함께 받는다.
      - name: 타깃을 받는다
        run: rustup target add ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-rel-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-rel-${{ matrix.target }}-

      # **musl 판은 C 컴파일러를 쓴다**(moai-omww). `ureq` 의 `rustls` 기능이 `ring` 을 끌고
      # 오는데, 그 크레이트는 제 build.rs 에서 C 와 어셈블리를 짓는다 — 그때까지 이 저장소는
      # 통째로 Rust 라 아무 C 도구도 필요 없었고, 그래서 이 스텝이 없었다.
      #
      # `cc` 는 `x86_64-unknown-linux-musl` 을 `x86_64-linux-musl-gcc`(없으면 `musl-gcc`)로
      # 푼다. `ubuntu-latest` 에는 둘 다 없어서, 이 줄이 빠지면 태그를 밀고 나서야 그 칸이
      # 죽는다 — `release:` 가 `needs: build` 라 그날 아무것도 안 나간다. **PR 은 못 잡는다**:
      # ci.yml 도 smoke.yml 도 호스트 판만 지어 musl 을 아예 안 건드린다.
      #
      # macOS 칸에는 clang 이 이미 서 있어 이 스텝이 필요 없다.
      - name: musl 의 C 도구를 받는다
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 15MB 는 이 도구가 지고 가는 예산이다 (CLAUDE.md 의 표). 넘긴 채로 올리면
      # 받는 사람 쪽에서야 드러난다. 자는 ci.yml 과 나눠 쓰는 것 하나다.
      - name: 15MB 예산을 잰다
        run: scripts/check-size.sh "target/${{ matrix.target }}/release/moai"

      - name: 꾸린다
        id: pack
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(scripts/check-version.sh --print)
          name="moai-v$version-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/moai" "$name/"
          cp README.md CHANGELOG.md LICENSE "$name/"
          # macOS 의 tar 는 bsdtar 다. `--` 를 안 쓰는 꼴로 맞춘다.
          tar czf "$name.tar.gz" "$name"
          printf 'name=%s\n' "$name" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.name }}.tar.gz
          if-no-files-found: error

  release:
    name: GitHub 릴리스
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # 릴리스를 만드는 잡 하나만 쓰기를 든다.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # checksums 는 산출물 곁에 한 파일로 둔다. install.sh 가 이것 없이는 설치를
      # 거부한다 (moai-j54h) — 이 스텝이 빠지면 그쪽이 조용히 못 깔리는 것이
      # 아니라 **소리 내어** 거부한다.
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz >SHA256SUMS
          cat SHA256SUMS

      # 설치 스크립트도 릴리스에 함께 둔다 — 받는 사람이 판마다 그때의 스크립트를
      # 쓸 수 있다. 합계를 낸 뒤에 넣어, SHA256SUMS 는 산출물만 담는다.
      - name: install.sh 를 함께 올린다
        run: cp install.sh dist/

      # 릴리스 노트는 CHANGELOG 의 이번 판 절을 그대로 쓴다. 그 절이 없으면 커밋
      # 목록으로 대신한다 — 노트가 없다고 릴리스를 멈추지는 않는다.
      - name: 노트를 고른다
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${REF_NAME#v}
          # **머리줄을 정규식으로 안 짠다.** 판에 든 `.` 하나가 아무 글자나 맞히는
          # 자리가 되고(`0.1.0` 이 `## [0x1y0]` 을 집는다), 켜는 규칙이 끝내는 규칙보다
          # 앞이라 한 번 어긋나면 두 절이 이어 붙는다. install.sh 가 SHA256SUMS 의
          # 파일 이름을 낱말째 견주는 것과 같은 자리다.
          awk -v head="## [$version]" '
            index($0, "## [") == 1 { on = (index($0, head) == 1); next }
            on { print }
          ' CHANGELOG.md >notes.md

      - name: 올린다
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$REF_NAME")
          case $REF_NAME in
          *-*) args+=(--prerelease) ;;
          esac
          # **빈 절은 노트가 아니다.** `[ -s ]` 는 개행 한 줄에도 참이라, 아무것도 안
          # 쌓인 판을 빈 몸으로 내보낸다 — 커밋 목록으로 대신하라고 둔 갈래가 그때
          # 안 선다. 글자가 있을 때만 그 파일을 쓴다. 고르는 자리를 올리는 자리와
          # 한 스텝에 둔 것은 `notes.md` 가 이미 답이기 때문이다.
          if grep -q '[^[:space:]]' notes.md; then
            printf '노트: CHANGELOG 의 %s 절\n' "${REF_NAME#v}"
            args+=(--notes-file notes.md)
          else
            printf '노트: 이번 판 절이 비었다 — 커밋 목록으로 대신한다\n'
            args+=(--generate-notes)
          fi
          gh release create "$REF_NAME" "${args[@]}" dist/*
