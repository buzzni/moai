# `v*` 태그를 밀면 바이너리와 checksums 를 GitHub 릴리스에 올린다.
#
# cargo-dist 를 안 쓰고 손으로 적은 까닭은 고칠 수 있게 하기 위해서다 (사람이
# 정했다, 2026-09-20). 생성한 워크플로는 손으로 고치면 안 되는데, 여기에는 이
# 저장소만의 규칙이 둘 있다 — 바이너리 15MB 예산과 설치 스크립트가 checksums
# 없이는 안 깔게 하는 것(moai-j54h). 그 둘을 생성물 위에 얹으면 다음 생성이
# 지운다.
#
# 배포 채널은 GitHub Releases 와 install.sh 까지다 (사람이 정했다, 2026-09-20).
# crates.io 와 Homebrew tap 은 이번 범위가 아니다.
name: release

on:
  push:
    tags: ["v*"]
  # 태그 없이 한 번 돌려 볼 자리. 올리는 잡은 태그일 때만 선다.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 태그를 믿고 굴러가는 것이 이 워크플로 전체라, 믿어도 되는지를 맨 앞에서 잰다.
  guard:
    name: 태그와 Cargo.toml
    runs-on: ubuntu-latest
    # 빌드 행렬이 이 뒤에 선다 — 여기가 매달리면 행렬이 기본 6시간을 기다린다.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 태그 이름은 `${{ }}` 로 스크립트에 붙이지 않는다 — 이름에 든 글자가 셸
      # 명령이 되는 자리다. 환경으로 준다.
      - name: 판이 어긋나면 여기서 멈춘다
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            scripts/check-version.sh "$REF_NAME"
          else
            # **대입으로 받는다.** `printf "$(…)"` 안의 명령 치환이 지면 `set -e` 가
            # 그것을 못 봐, 판을 못 읽은 판이 빈칸을 찍고 초록으로 지나간다 — 일찍
            # 멈추라고 둔 잡이 안 멈추는 자리다.
            version=$(scripts/check-version.sh --print)
            printf '태그가 아닌 판이다 — Cargo.toml 의 %s 로 굴러간다\n' "$version"
          fi

  build:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # **모든 칸이 bash 로 돈다**(moai-j9gv.ukd). Windows 러너의 기본 셸은 pwsh 라, 셸 스크립트를
    # 부르는 스텝(`check-size.sh`)과 `set -euo pipefail` 로 쓴 꾸리기가 그 칸에서만 다른 말로
    # 읽힌다. 러너에는 Git Bash 가 서 있다.
    defaults:
      run:
        shell: bash
    strategy:
      # 한 칸이 죽어도 남은 칸은 끝까지 간다 — 무엇이 되고 무엇이 안 되는지를
      # 한 판에서 본다.
      fail-fast: false
      matrix:
        include:
          # musl 정적 판이다. 어느 배포판에서도 돌고 컨테이너에서도 돈다.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # 네이티브 msvc 판이다(2026-10-12 사용자 결정, moai-j9gv). CRT 를 정적으로 묶는 것은
          # `.cargo/config.toml` 이 맡는다 — 깨끗한 Windows 에 vcruntime140.dll 이 없어도 뜬다.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # ARM64 Windows 판이다(moai-uwzg.q1j). **x64 러너에서 엇짓는다** — `windows-latest` 에는 rustup 과
          # VS 의 ARM64 MSVC 도구, `ring` 이 이 타깃에서 찾는 clang(LLVM)이 다 서 있다. `windows-11-arm`
          # 러너로 제 기계에서 짓는 길은 그 이미지에 rustup 이 서는지 이 저장소가 재 보지 않았다.
          # 엇지은 판은 이 잡에서 못 돌려 보니, 재는 것은 링크가 섰다는 것과 크기 예산, PE 버전 정보까지다.
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # **이 잡은 캐시를 안 쓴다** (사람이 정했다, 2026-09-23). GitHub 은 캐시를 판을
      # 낸 ref 와 기본 가지에서만 읽는데, 이 워크플로는 태그와 손으로 돌린 판에서만
      # 돈다 — `refs/tags/v0.1.0` 이 담은 것을 `refs/tags/v0.1.1` 이 못 읽는다. 담는
      # 자리가 죽은 자리라, 태그마다 700MiB 를 싸서 올려 두고 아무도 안 푼다.
      #
      # **걷어서 드는 값은 벽시계 3초다.** 태그 v0.1.1 판에서 쟀다 (run 35682406130,
      # 전체 2m52s) — build 스텝은 musl 이 cold 92s·낡은 접두사 81s·exact 45s, darwin
      # 이 cold 122s·낡은 접두사 109s·exact 118s 고, 캐시를 넣고 빼는 값은 musl 6s·
      # darwin 10s 다. 벽시계에 남는 것은 darwin 인데(잡 2m18s, musl 은 2m03s) 거기서는
      # LTO 링크가 캐시를 안 타 exact hit 이 cold 와 같다. `rustup-<타깃>` 쪽은 아예
      # 빈다 — 그 열쇠는 태그 자리에만 있고 `develop` 에는 없다.
      #
      # **develop 에서 이 행렬을 함께 도는 길은 안 간다.** 그러면 열쇠가 기본 가지에
      # 서서 태그가 맞히지만, 사는 것이 벽시계 10~15초인데 develop 푸시마다(하루 9번)
      # 러너 둘이 더 돌고 macOS 는 공개 저장소에서 동시 5칸이다. 저장소 캐시도 지금
      # 4.17GB/10GB 라, LRU 가 PR 마다 쓰는 `cargo-dev`(410MiB)를 밀어낼 자리였다.
      #
      # `ci.yml` 과 `smoke.yml` 의 캐시는 그대로 둔다. 다만 **맞는 까닭이 서로 다르다** —
      # `ci.yml` 은 PR 과 `develop` 푸시에서 돌아 열쇠가 기본 가지에 서고, `smoke.yml` 은
      # PR 에서 아예 안 도는 대신 밤마다 `schedule` 로 도는데 그 판이 기본 가지에서 돌아
      # 같은 자리에 담긴다. 그래서 `smoke.yml` 의 태그 판도 밤이 담아 둔 것을 읽는다.
      # **그 밤 판을 걷으면 그쪽도 여기와 똑같이 죽은 자리가 된다** — 태그와
      # `workflow_dispatch` 만 남아, 담기만 하고 아무도 안 푸는 캐시가 된다.
      - name: 타깃을 받는다
        run: rustup target add ${{ matrix.target }}

      # **musl 판은 C 컴파일러를 쓴다**(moai-omww). `ureq` 의 `rustls` 기능이 `ring` 을 끌고
      # 오는데, 그 크레이트는 제 build.rs 에서 C 와 어셈블리를 짓는다 — 그때까지 이 저장소는
      # 통째로 Rust 라 아무 C 도구도 필요 없었고, 그래서 이 스텝이 없었다.
      #
      # `cc` 는 `x86_64-unknown-linux-musl` 을 `x86_64-linux-musl-gcc`(없으면 `musl-gcc`)로
      # 푼다. `ubuntu-latest` 에는 둘 다 없어서, 이 줄이 빠지면 태그를 밀고 나서야 그 칸이
      # 죽는다 — `release:` 가 `needs: build` 라 그날 아무것도 안 나간다. **PR 은 못 잡는다**:
      # ci.yml 도 smoke.yml 도 호스트 판만 지어 musl 을 아예 안 건드린다.
      #
      # macOS 칸에는 clang 이 이미 서 있어 이 스텝이 필요 없다.
      - name: musl 의 C 도구를 받는다
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Windows 칸의 바이너리만 이름에 `.exe` 가 붙는다. 이름을 고르는 자리를 둘로 두지 않으려고
      # 여기서 한 번 고르고 뒤의 스텝이 받아 쓴다.
      - name: 바이너리 이름을 고른다
        id: exe
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case $TARGET in
          *-windows-*) printf 'name=moai.exe\n' >>"$GITHUB_OUTPUT" ;;
          *) printf 'name=moai\n' >>"$GITHUB_OUTPUT" ;;
          esac

      # **PE 버전 정보가 실제로 들었는가**(moai-uwzg.kpx). `build.rs` 가 손으로 쓴 `.res` 를 링커에
      # 넘기는데, 리눅스의 시험은 바이트 배치까지만 잰다 — 링커가 받았는지, Windows 가 그것을 읽는지는 Windows
      # 러너에서만 보인다. PR 의 `windows` 잡이 디버그 판으로 먼저 보고, 여기서는 내보낼 판 둘을 본다.
      # 엇지은 aarch64 판도 리소스는 읽힌다(실행하지 않는다).
      #
      # **판은 `check-version.sh` 가 읽어 넘긴다.** `Cargo.toml` 을 pwsh 로 또 읽으면 `[package]` 표를 가리는
      # 자가 둘이 된다(그 스크립트의 머리글). pwsh 안의 `bash` 는 WSL 의 것을 집을 수 있어 거기서 못 부르니,
      # 이 칸의 bash 스텝이 읽고 pwsh 스텝은 받아 쓴다.
      - name: 판을 읽는다
        id: version
        if: contains(matrix.target, '-windows-')
        run: |
          set -euo pipefail
          version=$(scripts/check-version.sh --print)
          printf 'value=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: PE 버전 정보를 읽는다
        if: contains(matrix.target, '-windows-')
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          WANT: ${{ steps.version.outputs.value }}
        run: |
          $want = $env:WANT
          if (-not $want) { Write-Output '::error::Cargo.toml 의 판을 못 받았다'; exit 1 }
          $info = (Get-Item "target/$env:TARGET/release/moai.exe").VersionInfo
          $info | Format-List ProductName, ProductVersion, FileVersion, FileDescription, LegalCopyright
          if ($info.ProductVersion -ne $want -or $info.ProductName -ne 'moai') {
            Write-Output "::error::moai.exe 의 버전 정보가 '$($info.ProductName) $($info.ProductVersion)' 다 — 'moai $want' 여야 한다"
            exit 1
          }

      # 15MB 는 이 도구가 지고 가는 예산이다 (CLAUDE.md 의 표). 넘긴 채로 올리면
      # 받는 사람 쪽에서야 드러난다. 자는 ci.yml 과 나눠 쓰는 것 하나다.
      - name: 15MB 예산을 잰다
        run: scripts/check-size.sh "target/${{ matrix.target }}/release/${{ steps.exe.outputs.name }}"

      - name: 꾸린다
        id: pack
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ steps.exe.outputs.name }}
        run: |
          set -euo pipefail
          version=$(scripts/check-version.sh --print)
          name="moai-v$version-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/$EXE" "$name/"
          cp README.md CHANGELOG.md LICENSE "$name/"
          # **Windows 칸은 zip 이다**(2026-10-12 사용자 결정). install.ps1 이 `Expand-Archive` 로
          # 푸는데, 그것은 Windows PowerShell 5.1 에도 서고 tar.gz 는 못 읽는다. `7z` 는 러너에 있다.
          # 안의 꼴(`<이름>/moai.exe`)은 tar.gz 와 같다 — 두 설치 스크립트가 같은 자리를 찾는다.
          case $TARGET in
          *-windows-*)
            7z a -tzip "$name.zip" "$name" >/dev/null
            printf 'file=%s.zip\n' "$name" >>"$GITHUB_OUTPUT"
            ;;
          *)
            # macOS 의 tar 는 bsdtar 다. `--` 를 안 쓰는 꼴로 맞춘다.
            tar czf "$name.tar.gz" "$name"
            printf 'file=%s.tar.gz\n' "$name" >>"$GITHUB_OUTPUT"
            ;;
          esac
          printf 'name=%s\n' "$name" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

  release:
    name: GitHub 릴리스
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # 릴리스를 만드는 잡 하나만 쓰기를 든다.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # checksums 는 산출물 곁에 한 파일로 둔다. install.sh 와 install.ps1 이 이것 없이는
      # 설치를 거부한다 (moai-j54h) — 이 스텝이 빠지면 그쪽이 조용히 못 깔리는 것이
      # 아니라 **소리 내어** 거부한다. zip 도 같은 파일에 선다 — 두 스크립트가 제 산출물의
      # 이름을 낱말째 찾는다.
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.zip >SHA256SUMS
          cat SHA256SUMS

      # 설치 스크립트도 릴리스에 함께 둔다 — 받는 사람이 판마다 그때의 스크립트를
      # 쓸 수 있다. 합계를 낸 뒤에 넣어, SHA256SUMS 는 산출물만 담는다.
      - name: 설치 스크립트를 함께 올린다
        run: cp install.sh install.ps1 dist/

      # 릴리스 노트는 CHANGELOG 의 이번 판 절을 그대로 쓴다. 그 절이 없으면 커밋
      # 목록으로 대신한다 — 노트가 없다고 릴리스를 멈추지는 않는다.
      - name: 노트를 고른다
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${REF_NAME#v}
          # **머리줄을 정규식으로 안 짠다.** 판에 든 `.` 하나가 아무 글자나 맞히는
          # 자리가 되고(`0.1.0` 이 `## [0x1y0]` 을 집는다), 켜는 규칙이 끝내는 규칙보다
          # 앞이라 한 번 어긋나면 두 절이 이어 붙는다. install.sh 가 SHA256SUMS 의
          # 파일 이름을 낱말째 견주는 것과 같은 자리다.
          awk -v head="## [$version]" '
            index($0, "## [") == 1 { on = (index($0, head) == 1); next }
            on { print }
          ' CHANGELOG.md >notes.md

      - name: 올린다
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$REF_NAME")
          case $REF_NAME in
          *-*) args+=(--prerelease) ;;
          esac
          # **빈 절은 노트가 아니다.** `[ -s ]` 는 개행 한 줄에도 참이라, 아무것도 안
          # 쌓인 판을 빈 몸으로 내보낸다 — 커밋 목록으로 대신하라고 둔 갈래가 그때
          # 안 선다. 글자가 있을 때만 그 파일을 쓴다. 고르는 자리를 올리는 자리와
          # 한 스텝에 둔 것은 `notes.md` 가 이미 답이기 때문이다.
          if grep -q '[^[:space:]]' notes.md; then
            printf '노트: CHANGELOG 의 %s 절\n' "${REF_NAME#v}"
            args+=(--notes-file notes.md)
          else
            printf '노트: 이번 판 절이 비었다 — 커밋 목록으로 대신한다\n'
            args+=(--generate-notes)
          fi
          gh release create "$REF_NAME" "${args[@]}" dist/*

  # 릴리스가 나간 뒤에 Discord 에 소식을 올린다(moai-hwl4). 시험판(`-rc` 같은 꼬리)은 안 알린다.
  # 이 잡이 붉어도 릴리스는 이미 나갔다 — discord.yml 을 손으로 다시 돌리면 된다.
  discord:
    name: Discord 소식
    needs: release
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    uses: ./.github/workflows/discord.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
