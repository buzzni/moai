# PR 과 develop 푸시에서 도는 검사. 태그는 릴리스 워크플로가 따로 본다.
#
# 잡을 둘로 가른 까닭은 시간이다. `[profile.release]` 의 `lto = true` 가 링크를
# 분 단위로 만들어, 시험과 한 잡에 두면 clippy 가 30초에 낼 답을 릴리스 링크
# 뒤에서 기다린다. 둘이 나란히 돌면 벽시계는 느린 쪽 하나다.
name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

# 같은 가지에 새 커밋이 오면 앞 판을 끊는다. 낡은 판이 러너를 붙들지 않게 한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 죽은 시험이 어디서 죽었는지 로그만 보고 알게 한다.
  RUST_BACKTRACE: 1

jobs:
  # 이것 하나가 required check 로 선다. 갈래를 늘리면 저장소 보호 규칙도 같이
  # 는다 — 검사를 더할 자리는 새 잡이 아니라 이 잡의 스텝이다.
  ci-gate:
    name: clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 밑의 트래커 검사가 base 와 head 를 둘 다 짚는다.
          fetch-depth: 0

      # **이 저장소의 이슈는 저장소 안의 파일이다.** 그래서 남의 포크에서 온 PR 이
      # `.moai/` 를 고치면, 그것은 코드 제안이 아니라 이쪽 계획을 고치는 커밋이다 —
      # 대개는 그쪽 클론에서 도구를 써 보다 딸려 온 것이다. 막고, 되돌리는 명령을
      # 함께 댄다. 같은 저장소의 가지는 지나간다. 관리자는 트래커를 고치는 것이 일이다.
      - name: 남의 포크가 트래커를 고쳤는지 본다
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          touched=$(git diff --name-only "$BASE" "$HEAD" -- .moai/)
          if [ -n "$touched" ]; then
            printf '%s\n' "$touched"
            echo "::error::포크에서 온 PR 은 .moai/ 를 고칠 수 없다. 이 저장소의 이슈는 저장소 안의 파일이라, 그 변경은 코드가 아니라 이쪽 계획이다. 아래로 되돌리고 하려던 말은 PR 글에 적는다 —  git restore --source=$BASE -- .moai/ && git commit -m 'revert: 트래커는 그대로 둔다' -- .moai/"
            exit 1
          fi
          echo "트래커는 그대로다"

      - name: 도구 판을 적는다
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-dev-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-dev-${{ runner.os }}-

      # clippy 와 시험에 `--release` 를 붙이지 않는다 — LTO 링크가 파일 하나
      # 고칠 때마다 다시 돌아 dev 의 초 단위가 분 단위가 된다 (CLAUDE.md).
      #
      # 경고를 오류로 올린다. 새 경고가 붙는 자리는 PR 이고, 쌓인 뒤에 걷으면
      # 그 판이 통째로 남의 일이 된다. 저장소가 일부러 지고 가는 lint 는
      # Cargo.toml 의 `[lints.clippy]` 에 까닭과 함께 적혀 있다.
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked

      # `cargo fmt --check` 는 아직 없다. 저장소가 rustfmt 를 한 번도 안 거쳐
      # 지금 켜면 3,971 군데가 붉어지고, 맞추는 커밋이 옆에서 도는 워크트리들과
      # 통째로 충돌한다. moai-jlon 과 moai-4y5s 와 moai-hom6 이 다 든 뒤에 친다 —
      # 그 커밋을 언제 어떻게 치는지는 moai-hwxc 에 있다.

  # 15MB 는 이 도구가 지고 가는 예산이다 (CLAUDE.md 의 표). 넘긴 것을 릴리스
  # 태그에서 처음 알면 그때는 되돌릴 자리가 없으니 PR 에서 잰다.
  size-budget:
    name: release 바이너리 15MB 예산
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: build --release
        run: cargo build --release --locked

      - name: 예산을 잰다
        run: |
          set -euo pipefail
          limit=$((15 * 1024 * 1024))
          # `stat` 의 인자가 리눅스와 macOS 에서 달라, 릴리스 워크플로와 같은
          # 꼴로 맞춘다.
          size=$(wc -c <target/release/moai | tr -d '[:space:]')
          printf 'target/release/moai  %s bytes / %s bytes\n' "$size" "$limit"
          if [ "$size" -gt "$limit" ]; then
            echo "::error file=Cargo.toml::바이너리가 15MB 예산을 넘었다 ($size > $limit bytes). lto 를 낮추지 말고 무엇이 들어왔는지 먼저 본다 — 예산이 먼저다."
            exit 1
          fi
