# 옛 릴리스 바이너리가 쓴 스냅샷을 새 바이너리가 만져도 남의 줄이 그대로인지
# 본다.
#
# PR 마다 돌리지 않는다. 재는 것이 **판과 판 사이**라, 한 PR 안에서는 잴 것이
# 없고 릴리스를 내려받는 데 드는 시간만 든다. 밤과 태그에서만 돈다.
name: smoke

on:
  schedule:
    # 매일 03:17 UTC. 정각을 피하는 것은 그때 러너가 붐비기 때문이다.
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-version:
    name: 옛 판이 쓴 스냅샷을 새 판이 만진다
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 견줄 옛 판을 고른다. **릴리스가 하나도 없으면 이 시험은 할 말이 없다** —
      # 없는 것을 실패로 적으면 첫 릴리스 전까지 밤마다 붉은 줄이 선다.
      - name: 옛 판을 고른다
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # **`gh` 가 진 것과 "아직 릴리스가 없다" 를 가른다.** 한 파이프에 `|| true` 를
          # 걸면 토큰이 만료되거나 API 가 죽은 밤도 "없다" 로 읽혀, 아무것도 안 잰 판이
          # 초록으로 선다 — 그것을 지켜보는 사람은 없다. 목록은 따로 받아 진 것은 진 것으로 둔다.
          listed=$(gh release list --limit 5 --json tagName --jq '.[].tagName')
          # 지금 미는 태그 자신은 뺀다 — 릴리스 워크플로가 그것을 아직 올리는 중일 수 있다.
          # `-F` 로 낱말째 뺀다: 태그의 `.` 을 정규식으로 읽으면 옆 판을 대신 뺀다.
          tag=$(printf '%s\n' "$listed" | grep -vxF -- "$REF_NAME" | head -n 1 || true)
          if [ -z "$tag" ]; then
            echo "견줄 릴리스가 아직 없다 — 첫 릴리스 뒤부터 잰다" >>"$GITHUB_STEP_SUMMARY"
            printf 'tag=\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf '옛 판: %s\n' "$tag"
          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"

      # 툴체인을 캐시에서 푼다 — 까닭과 잰 값은 `ci.yml` 의 `ci-gate` 에 있다.
      # **`cargo` 를 처음 부르기 전에 선다.** 견줄 릴리스가 없는 밤에는 짓지도
      # 않으니 함께 건너뛴다.
      - name: 박아 둔 판을 읽는다
        id: toolchain
        if: steps.pick.outputs.tag != ''
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "::error::rust-toolchain.toml 에서 channel 을 못 읽었다"
            exit 1
          fi
          printf 'channel=%s\n' "$channel" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pick.outputs.tag != ''
        with:
          path: ~/.rustup/toolchains/${{ steps.toolchain.outputs.channel }}-*
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pick.outputs.tag != ''
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # **ci.yml 의 size-budget 과 열쇠를 나눠 쓴다.** 같은 열쇠에 같은 `target/` 을
          # 담으면 둘 중 먼저 끝난 쪽만 올라가고 진 쪽은 수백 MB 를 싸서 올렸다가 거절당한다.
          # 이긴 판은 그대로 굳어, 밤마다 그 낡은 `target/release` 를 풀고 LTO 를 다시 건다.
          key: cargo-smoke-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-smoke-${{ runner.os }}-

      - name: build --release
        if: steps.pick.outputs.tag != ''
        run: cargo build --release --locked

      # 옛 판은 설치 스크립트로 받는다 — 합계를 재는 길이 이미 거기 있고, 그
      # 길이 실제로 도는지도 밤마다 함께 재진다.
      - name: 옛 판을 받는다
        if: steps.pick.outputs.tag != ''
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          # 태그는 **이 저장소**의 릴리스 목록에서 골랐다 — 받는 자리도 같은 저장소여야
          # 한다. install.sh 의 기본은 `buzzni/moai` 라, 포크에서 돌면 그쪽 태그 이름으로
          # 본가의 파일을 받거나(짝이 안 맞는 것을 견준다) 404 로 밤마다 붉어진다.
          MOAI_REPO: ${{ github.repository }}
        run: sh install.sh --version "$TAG" --dir "$RUNNER_TEMP/old"

      - name: 견준다
        if: steps.pick.outputs.tag != ''
        env:
          NEW: target/release/moai
        run: OLD="$RUNNER_TEMP/old/moai" scripts/cross-version-smoke.sh
