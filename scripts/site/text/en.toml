# English text for the site. scripts/site/gen.py fills the templates beside it (layout.html,
# home.html, guide.html) with these, then `python3 scripts/site/gen.py` writes site/.
#
# `{{guide.start.3}}` in a template is key `3` of table [guide.start] here. Tables under [guide]
# take the id of the section they sit in; the numbers only name a slot — a new paragraph takes the
# next free number, in any order. Every language carries the same keys (test_gen.py checks).
# Values are HTML: inline markup (<code>, <strong>, <a>) goes inside, structure stays in the template.

