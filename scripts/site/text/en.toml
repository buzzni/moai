[home]
eyebrow = 'An issue tracker for people and coding agents'
install_meta = 'macOS · Linux · Windows · MIT · refuses to install anything it cannot verify against <code>SHA256SUMS</code> · <a href="https://github.com/buzzni/moai#install">other ways to install</a>'
logos = 'Products that work with Moai'
title = 'moai — an issue tracker for coding agents'
description = 'moai is an issue tracker for people and coding agents. It lives in your repository, needs no server, and lets several agents work from one plan.'

[home.rotator]
label = 'What moai does'

[[home.rotator.slides]]
tab = 'Agile'
headline = 'Agile, for your<br><em>coding agents.</em>'
lede = 'You bring the idea, and the agent makes the plan.<br>Big requests are split into small tasks and worked through by priority.<br>When requirements change, the plan changes with them.'

[[home.rotator.slides]]
tab = 'No server'
headline = 'No server.<br><em>Just your repo.</em>'
lede = 'The to-do list is committed with the code and merges along with your branches.<br>No accounts, no web service, no database.<br>Push and pull the repository to keep your teammates in sync on where the work stands.'

[[home.rotator.slides]]
tab = 'Multi-agent'
headline = 'Many agents.<br><em>One team.</em>'
lede = '''A supervisor agent splits up the work, and several agents take their share.<br>Each works in its own worktree, side by side, without getting in the others' way.<br>Finished work goes through review and is brought back together.'''

[[home.rotator.slides]]
tab = 'Specs'
headline = 'Every task starts<br><em>with a spec.</em>'
lede = 'What to do, why, and where to stop is written plainly on the issue.<br>The agent checks the notes and commits from earlier sessions.<br>It carries on from there instead of rebuilding the context from scratch.'

[[home.rotator.slides]]
tab = 'Memory'
headline = 'Explain it once.<br><em>They take it from there.</em>'
lede = 'Agents look up earlier decisions, and the reasons behind them, in the work history.<br>They find how things are done in the memory wiki, so the same mistakes are not repeated.<br>They get smarter as time goes on.'

[home.team]
cast_label = 'Four tmux panes: moai tui, a Claude Code supervisor, and Codex and Antigravity workers'
heading = 'Different vendors. One team.'
body = 'Agents from different vendors work together as a supervisor and its workers. The supervisor hands the remaining work to whichever workers are idle, so several tasks move at once. Start as many workers as you need: each one works in its own worktree, so nobody steps on anyone else, and the supervisor keeps things moving until the work is done.'
point1 = 'One sentence is enough: <q>Hand the backlog out to the idle sessions.</q>'
point2 = '''Clearing a worker's window, sending the next task, checking the report: the supervisor does all of it.'''
point3 = 'Planning to Claude Fable, development to Codex Sol, chores to Antigravity Gemini, review to Claude Opus. Give each job to the model that does it best.'

[home.scene1]
heading = 'Every view, in one terminal.'
body = 'The list, a kanban board with a lane per milestone, and the wiki, all on one screen. Whatever sits under the cursor shows its detail beside it. It is a terminal, and the mouse still works everywhere.'
media_label = 'moai tui moving from the list to the kanban board and the wiki'

[home.scene2]
heading = 'Holds its own against any issue tracker.'
body = 'Detailed work orders, the notes left along the way, commits and dates: all of it at a glance.'
media_label = 'moai web showing an issue with its description, commits and history'

[home.scene3]
heading = 'Stop using another product just to keep your docs.'
body = 'Agents write into the wiki built into moai as they work. Have them write up one part or the whole thing in a few words, and they lean on it from then on.'
media_label = 'moai web wiki: following links between pages and into an issue'

[home.scene4]
heading = 'See progress and flow at a glance.'
body = 'An idea starts in the backlog, gets split from milestone and epic down into tasks, and goes through review to done. Agents move every card along the way.'
media_label = 'A card created in the backlog moving across the board to done'

[home.cta]
heading = 'Give your agents<br>a place to work.'
body = 'Installing is one line. Then open <code>moai tui</code> in the terminal, or <code>moai web</code> in the browser.'
windows = 'On Windows, use <a href="https://github.com/buzzni/moai#windows"><code>install.ps1</code></a>.'

