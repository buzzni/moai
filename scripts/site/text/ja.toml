[guide.install]
1 = 'インストール'
2 = 'インストールスクリプトはリリースファイルと <code>SHA256SUMS</code> を一緒にダウンロードし、チェックサムが合わなければインストールしません。この検査を無効にするオプションはありません。'

[guide.install-unix]
1 = 'インストール先は <code>~/.local/bin</code> です。このディレクトリが <code>PATH</code> に含まれていれば <code>moai</code> で呼び出せます。'
2 = '別の場所や特定のバージョンでインストールするには、<code>-s --</code> の後にオプションを付けます。'

[guide.install-windows]
1 = 'PowerShell でスクリプトをダウンロードし、ファイルとして実行します。'
2 = 'インストール先は <code>%LOCALAPPDATA%\Programs\moai</code> です。<code>-Dir</code> で場所を、<code>-Version</code> でバージョンを選べます。'
3 = 'インストールスクリプトは <code>PATH</code> を変更しません。インストール先が <code>PATH</code> にない場合は一行で知らせます。'
4 = '<code>irm … | iex</code> のようにパイプで実行する方法には対応していません。スクリプトの終了とともに PowerShell のウィンドウも閉じてしまうためです。'
5 = 'Visual C++ 再頒布可能パッケージのないクリーンな PC でもそのまま動きます。'

[guide.update]
1 = 'アップデート'
2 = '実行中の moai を最新リリースに置き換えます。新しいバージョンが出ると <code>moai tui</code> の画面上部にも表示されます。最初にインストールしたときのコマンドをもう一度実行してもアップデートできます。'

[guide.platforms]
1 = '対応プラットフォーム'
2 = 'ビルド済みバイナリは Linux（x86_64）、macOS（Apple Silicon）、Windows（x86_64・ARM64）向けがあります。それ以外の環境ではソースから <code>cargo build --release</code> でビルドします。'

