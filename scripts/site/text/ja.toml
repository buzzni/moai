4 = '<strong>マイルストーン</strong> — 一度にリリースする単位です。エピックをマイルストーンにつなぐと、その下のイシューも一緒に含まれます。'
5 = 'エピックとマイルストーンの状態は手で動かしません。配下の作業を一つでも始めれば進行中に、すべて終われば完了に自動で変わります。'
6 = 'マイルストーンが進行中のあいだは、その中の作業が優先です。<code>moai ready</code> は進行中のマイルストーンの作業と <code>p0</code>（緊急）だけを渡し、残りは後回しにします。進行中のマイルストーンに作業を追加するかどうかはユーザーが決めます。'
7 = '計画を見せるとき、エージェントは期限も一緒に尋ねます。答えがなければ期限なしのままにします。'

[guide.worktrees]
1 = 'ワークツリーを作ってマージするまで'
2 = '複数のセッションが一つのブランチにコミットを積むと、マージのときにお互いを待つことになります。moai のエージェントは作業ごとに別のブランチを作ります。'
3 = '<strong>作業を引き受けます。</strong>イシューを <code>in_progress</code> に移します（<code>moai mv &lt;id&gt; in_progress --from todo</code>）。ほかのセッションがすでに引き受けていれば移さず、次の作業に進みます。'
4 = '<strong>ワークツリーを作ります。</strong>リポジトリ内の <code>.worktrees/&lt;エピック&gt;</code> に新しいブランチでチェックアウトします。Claude Code・Codex・Antigravity がすべて同じ場所を使います。'
5 = '<strong>その中で作業してコミットします。</strong>コミットの件名にイシュー id を書いておくと、<code>moai show &lt;id&gt;</code> がそのイシューのコミットを見つけて表示します。'
6 = '<strong>レビューを受けます。</strong>エピックが終わったらエピック全体を一度レビューし、指摘を反映します。'
7 = '<strong>マージして片付けます。</strong>ベースブランチに <code>--no-ff</code> でマージし、ワークツリーとブランチを削除してからイシューを <code>done</code> に移します。'
8 = '<strong>トラッカーは常にルートにあります。</strong>ワークツリーの中で <code>moai</code> を実行しても、ルートの <code>.moai/</code> を読み書きします。ほかのセッションからも誰が何を引き受けたかがすぐ分かり、マージのときにトラッカーのファイルが衝突しません。'
9 = '<strong>マイルストーンに属する作業はマイルストーンのブランチから始めます。</strong><code>milestone/&lt;マイルストーン id&gt;</code> ブランチからエピックのブランチを作り、作業が終わったらマイルストーンのブランチにマージし直します。マイルストーンのブランチはリリースのときに一度にベースブランチへ入ります。'
10 = '隣のワークツリーが何をしているかは <code>moai ready --worktree</code> で確認します。'

[guide.backlog]
1 = 'バックログ'
2 = 'いますぐやらないことはバックログに入れます。'
3 = "moai backlog add 'ボードをエピックごとに折りたためたらどうか'"
4 = '思いついたことをバックログに入れ、エピックとイシュー三つに展開する画面'
5 = 'バックログは、まだ実行する作業として確定していないアイデアです。ボードと <code>moai ready</code> には表示されません。'
6 = '作業中に思いついたアイデアがいまの範囲を外れるなら、バックログに残しておきます。'
7 = '時が来たら <code>moai backlog promote &lt;id&gt;</code> でエピックとイシューを作ります。元のバックログは閉じられ、新しい作業の履歴から元のメモをたどれます。'
8 = '''すでに作った作業をいまはやらないと決めたなら、バックログではなく <code>moai defer &lt;id&gt; -m '理由'</code> で先送りします。<code>--undo</code> でそのまま元に戻せます。'''

