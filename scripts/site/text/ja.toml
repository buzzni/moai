3 = '<strong>tmux</strong> — <code>moai-tmux</code>。監督がワーカーのペインにラベルを付け、報告が終わったペインを <code>/clear</code> で空にし、届かなかったメッセージを貼り付けます。ワーカーが足りなければ、許可を得てから新しいペインを開きます。'
