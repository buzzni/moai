3 = 'tui 의 목록에서 마일스톤을 펼치고, 찾고, 거르고, 기한으로 정렬하는 화면'
4 = 'moai web 에서 이슈의 설명, 커밋, 이력을 읽는 화면'
5 = '<code>Enter</code>로 마일스톤이나 에픽에 들어가고, <code>Backspace</code>로 나옵니다. <code>l</code>은 한 단계 펼치고, <code>h</code>는 접습니다. <code>Tab</code>은 하위 항목을 모두 펼칩니다.'
