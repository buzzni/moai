[guide.develop]
1 = 'moai로 시작하는 개발 지시'

[guide.milestones]
1 = '큰 작업은 마일스톤과 에픽으로 나눕니다'
2 = 'moai에서는 에픽과 마일스톤으로 이슈를 묶어 관리합니다.'
3 = '<strong>에픽</strong> — 한 가지 목적을 위한 이슈 묶음입니다. 여러 파일을 수정해야 하는 요청이라면 에이전트가 에픽 하나와 이슈 3~7개로 나눈 계획을 먼저 보여 주고, 승인하면 한 번에 만듭니다.'
4 = '<strong>마일스톤</strong> — 한 번에 내보낼 릴리스 단위입니다. 에픽을 마일스톤에 연결하면 하위 이슈도 함께 포함됩니다.'
5 = '에픽과 마일스톤의 상태는 직접 옮기지 않습니다. 하위 작업을 하나라도 시작하면 진행 중으로, 모두 끝내면 완료로 자동 변경됩니다.'
6 = '마일스톤이 진행 중일 때는 그 안의 일이 먼저입니다. <code>moai ready</code>는 진행 중인 마일스톤의 일과 <code>p0</code>(긴급) 만 내주고, 나머지는 뒤로 미룹니다. 진행 중인 마일스톤에 작업을 추가할지는 사용자가 결정합니다.'
7 = '계획을 보여 줄 때 에이전트는 마감일도 함께 묻습니다. 답하지 않으면 마감일 없이 둡니다.'

[guide.worktrees]
1 = '워크트리를 만들고 머지하는 과정'
2 = '여러 세션이 한 브랜치에 커밋을 쌓으면 머지할 때 서로를 기다리게 됩니다. moai의 에이전트는 작업마다 별도의 브랜치를 만듭니다.'
3 = '<strong>작업을 맡습니다.</strong> 이슈를 <code>in_progress</code>로 옮깁니다(<code>moai mv &lt;id&gt; in_progress --from todo</code>). 다른 세션이 이미 맡았다면 옮기지 않고 다음 일로 넘어갑니다.'
4 = '<strong>워크트리를 만듭니다.</strong> 저장소 안의 <code>.worktrees/&lt;에픽&gt;</code>에 새 브랜치로 체크아웃합니다. Claude Code · Codex · Antigravity가 모두 같은 자리를 씁니다.'
5 = '<strong>그 안에서 작업하고 커밋합니다.</strong> 커밋 제목에 이슈 id를 적어 두면 <code>moai show &lt;id&gt;</code>가 그 이슈의 커밋을 찾아 보여 줍니다.'
6 = '<strong>리뷰를 받습니다.</strong> 에픽이 끝나면 에픽 전체를 한 번 리뷰하고, 리뷰 의견을 반영합니다.'
7 = '<strong>머지하고 정리합니다.</strong> 기본 브랜치로 <code>--no-ff</code> 머지하고, 워크트리와 브랜치를 지운 뒤 이슈를 <code>done</code>으로 옮깁니다.'
8 = '<strong>트래커는 늘 루트에 있습니다.</strong> 워크트리 안에서 <code>moai</code>를 실행해도 루트의 <code>.moai/</code>를 읽고 씁니다. 다른 세션에서도 작업 배정 상태를 바로 확인할 수 있고, 머지할 때 트래커 파일이 충돌하지 않습니다.'
9 = '<strong>마일스톤에 속한 작업은 마일스톤 브랜치에서 시작합니다.</strong> <code>milestone/&lt;마일스톤 id&gt;</code> 브랜치에서 에픽 브랜치를 만들고, 작업이 끝나면 다시 마일스톤 브랜치로 머지합니다. 마일스톤 브랜치는 릴리스할 때 한 번에 기본 브랜치로 들어갑니다.'
10 = '옆 워크트리가 무엇을 하고 있는지는 <code>moai ready --worktree</code>로 봅니다.'

[guide.backlog]
