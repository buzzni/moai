24 = '<strong>머지 드라이버</strong>'
25 = '브랜치 둘이 서로 다른 이슈를 고쳤을 때 git이 이슈 단위로 알아서 합치게 합니다'
26 = '트래커를 git에 올리면 켭니다(클론마다 한 번 필요합니다)'
27 = '<strong>프로젝트 목록에 추가</strong>'
