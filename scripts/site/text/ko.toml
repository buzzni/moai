5 = '일의 난이도에 맞는 역할(개발·복잡한 일·문서·잔일)을 고르고, 그 역할의 모델로 <strong>일꾼</strong>을 띄웁니다. 기본은 감독 세션 안의 서브에이전트입니다.'
6 = '일꾼은 백로그를 에픽으로 구체화하고, 워크트리에서 작업하고, 리뷰·머지·정리까지 마친 뒤 보고합니다.'
7 = '감독은 머지가 됐는지, 에픽이 닫혔는지, 워크트리가 지워졌는지 확인하고 다음 일을 보냅니다.'
8 = '일꾼 창을 직접 보고 싶으면 서브에이전트 대신 <strong>세션 일꾼</strong>을 씁니다. 저장소 루트에서 Claude Code 세션을 몇 개 열어 두면, 감독이 쉬고 있는 세션에 일을 보냅니다.'
9 = '설계 결정이 필요하면 일꾼이 멈추고 감독이 사람에게 묻습니다. 자리를 비울 때는 감독에게 알려 두면 일꾼이 권장안으로 정하고 이유를 이슈에 남깁니다.'
10 = '감독은 작업 선정과 배정, 결과 확인을 맡습니다. 코드 수정과 머지는 일꾼이 담당합니다.'

