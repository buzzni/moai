[guide.screens]
1 = 'tui 와 web'
2 = 'moai의 화면은 두 가지입니다. 에이전트는 화면을 열지 않아도 트래커 파일을 직접 읽고 수정합니다. 사용자는 진행 상황을 확인할 때 원하는 화면을 열면 됩니다.'

[guide.tui]
1 = 'moai tui — 터미널에서'
2 = '목록, 칸반, 간트, 통계, 위키를 터미널에서 봅니다. <code>SPC g</code>를 누른 뒤 화면별 키 하나를 누르면 전환됩니다. 다시 실행하면 마지막으로 보던 목록, 칸반, 간트 화면이 열립니다.'
3 = 'moai tui 에서 목록, 칸반, 위키로 옮겨 가는 화면'
4 = '마우스로 행을 클릭하거나 스크롤하고, 창 너비를 조절할 수 있습니다. 전체 키 목록은 <code>moai tui --help</code>에서 확인합니다.'
5 = '<code>SPC n</code>을 누르면 떠오른 생각을 바로 백로그에 적을 수 있습니다.'

[guide.web]
1 = 'moai web — 브라우저에서'
2 = '<code>127.0.0.1:6624</code>에서 목록, 칸반, 간트, 위키를 봅니다. 브라우저는 직접 열어야 합니다. 터미널이 익숙하지 않은 동료와 진행 상황을 공유할 때 쓸 수 있습니다.'
3 = '키는 tui와 거의 같습니다. 창 사이를 옮길 때만 <code>Ctrl-w</code> 대신 <code>SPC w</code>를 씁니다. 통계는 tui에서만 볼 수 있습니다.'
4 = '간트 막대를 끌어 날짜를 바꿀 수 있습니다. 그 밖의 트래커 내용은 읽기만 합니다.'
5 = '포트가 이미 사용 중이면 <code>--port</code>로 다른 포트를 지정합니다. <code>--port 0</code>을 주면 빈 포트를 고릅니다.'
6 = '종료하려면 <code>Ctrl-C</code>를 누릅니다.'

[guide.list]
1 = '목록 — 마일스톤과 에픽을 폴더처럼'
