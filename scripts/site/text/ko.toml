[guide.install]
1 = '설치'
2 = '설치 스크립트는 릴리스 파일과 <code>SHA256SUMS</code>를 함께 내려받고, 체크섬이 맞지 않으면 설치하지 않습니다. 이 검사를 끄는 옵션은 없습니다.'

[guide.install-unix]
1 = '기본 설치 위치는 <code>~/.local/bin</code> 입니다. 이 디렉터리가 <code>PATH</code>에 있어야 <code>moai</code>로 부를 수 있습니다.'
2 = '다른 위치나 특정 버전으로 설치하려면 <code>-s --</code> 뒤에 옵션을 붙입니다.'

[guide.install-windows]
1 = 'PowerShell에서 스크립트를 내려받아 파일로 실행합니다.'
2 = '기본 설치 위치는 <code>%LOCALAPPDATA%\Programs\moai</code> 입니다. <code>-Dir</code>로 위치를, <code>-Version</code>으로 버전을 고를 수 있습니다.'
3 = '설치 스크립트는 <code>PATH</code>를 고치지 않습니다. 설치 위치가 <code>PATH</code>에 없으면 한 줄로 알려 줍니다.'
4 = '<code>irm … | iex</code> 처럼 파이프로 실행하는 방식은 지원하지 않습니다. 스크립트가 끝날 때 PowerShell 창이 함께 닫히기 때문입니다.'
5 = 'Visual C++ 재배포 패키지가 없는 깨끗한 PC 에서도 그대로 실행됩니다.'

[guide.update]
1 = '업데이트'
2 = '지금 실행 중인 moai를 최신 릴리스로 바꿉니다. 새 버전이 나오면 <code>moai tui</code> 화면 위쪽에도 표시됩니다. 처음 설치할 때 쓴 설치 명령을 다시 실행해도 업데이트됩니다.'

[guide.platforms]
1 = '지원하는 플랫폼'
2 = '미리 빌드한 바이너리는 Linux(x86_64), macOS(Apple Silicon), Windows(x86_64·ARM64) 용이 있습니다. 그 밖의 환경에서는 소스에서 <code>cargo build --release</code>로 빌드합니다.'

