7 = '<code>SPC f</code>로 상태, 담당자, 태그, 마일스톤 등의 조건을 걸 수 있습니다. 입력하는 동안 선택할 수 있는 값이 위에 표시됩니다.'
8 = '<code>SPC s</code>로 우선순위, 기한, 갱신 시각 등 여러 기준을 조합해 정렬합니다. 정렬 설정은 다음에 실행할 때도 유지됩니다.'
