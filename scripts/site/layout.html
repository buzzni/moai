<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <!-- 링크 미리보기: og:image 가 없으면 미리보기 쪽이 페이지의 첫 그림(로고 띠)을 고른다. SVG 를 못 읽는 곳이 많아 PNG 다 -->
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:site_name" content="moai">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:locale" content="{{meta.locale}}">
  <meta property="og:image" content="https://moai.buzzni.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="moai — Issue tracker for AI agents">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="https://moai.buzzni.com/assets/og.png">
{{alternates}}
{{redirect}}
  <link rel="icon" href="{{root}}assets/mark.svg" type="image/svg+xml">
{{styles}}
</head>
<body>
