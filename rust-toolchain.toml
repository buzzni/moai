# 이 저장소를 짓는 판을 한자리에 박는다 (moai-jkpa, 2026-09-21 사용자 결정).
#
# ## 왜 두나
#
# CI 는 러너에 깔려 오는 stable 을 그대로 썼다. 그 판이 올라가는 날
# `cargo fmt --all --check` 가 어제 통과한 코드에 붉어진다 — rustfmt 의 꼴은 판마다
# 조금씩 움직이고, 그때 붉어지는 자리는 이번 PR 이 건드린 곳이 아니다. 코드와 상관없는
# 까닭으로 판이 서고, 그것을 맞춘 커밋이 남의 PR 에 섞인다. `-D warnings` 인 clippy 도
# 같은 길이다: 새 판이 새 lint 를 들고 오는 날 멀쩡한 PR 이 죽는다.
#
# ## 무엇이 딸려 오나
#
# rustup 이 이 파일을 보고 여기 적힌 판으로 `cargo`·`rustfmt`·`clippy` 를 돌린다.
# CI 와 기여자의 기계가 같은 판을 쓰니, 로컬에서 `cargo fmt` 를 돌린 결과가 CI 가 보는
# 것과 같다. 이 파일이 없으면 그 둘이 갈리는 것을 막을 자리가 아무 데도 없다.
#
# ## 대가
#
# - 소스에서 짓는 사람은 여기 적힌 판을 받게 된다 (rustup 이 알아서 받는다).
#   릴리스 바이너리를 받는 사람에게는 아무 일도 없다
# - `Cargo.toml` 의 `rust-version = "1.88"` 은 이제 아무도 안 밟는다. MSRV 가 참인지
#   재려면 그 판을 따로 돌리는 잡이 있어야 하고, 아직 없다
#
# ## 올릴 때
#
# `channel` 하나만 고치고 `cargo fmt --all` 을 한 판 돌려 **그 커밋에 함께 담는다.**
# 꼴이 바뀌는 커밋과 코드를 고치는 커밋을 섞지 않는다 — 섞으면 리뷰가 둘을 못 가른다.

[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
