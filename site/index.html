<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moai</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --fg: #ededea; --muted: #9a9a94; }
    }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; padding: 0 16px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    }
    main { text-align: center; }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 0 0 .25em; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, moai</h1>
    <p>An issue tracker that lives in your repository — <code>.moai/issues.jsonl</code></p>
  </main>
</body>
</html>
